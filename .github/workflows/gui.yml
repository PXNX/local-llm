name: GUI

# Builds gui/ (local-llm.exe) on every push/PR that touches it. A push to main whose gui/Cargo.toml version
# (semver: 1.2.0, 1.3.0-rc.1) has no GitHub release yet publishes one as vX.Y.Z (pre-release for a -suffix),
# tagging the commit if release.bat didn't already. Releases come only from here - release.bat just bumps,
# builds locally, tags and pushes. Nothing private is used or embedded: keys live in the user's local .env.
# (No tag trigger: GitHub applies the paths filter to tag pushes too, so tags alone never built a release.)
on:
  push:
    branches: [main]
    paths: ["gui/**", "models.json", ".github/workflows/gui.yml"]
  pull_request:
    paths: ["gui/**", "models.json", ".github/workflows/gui.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: gui
    steps:
      - uses: actions/checkout@v5

      - name: Version (release when it has none yet)
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$'
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          [[ $version =~ $semver ]] || { echo "::error::gui/Cargo.toml version $version is no semver (X.Y.Z[-pre])"; exit 1; }
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" != pull_request ] && [ "$GITHUB_REF" = refs/heads/main ] \
             && ! gh release view "v$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "v$version has no release yet - publishing it after the build"
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: gui

      - name: Lint
        run: cargo clippy --release --locked -- -D warnings

      - name: Test
        run: cargo test --release --locked

      - name: Build
        run: cargo build --release --locked

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/local-llm.exe dist/
          Compress-Archive -Path dist/local-llm.exe -DestinationPath dist/local-llm-windows-x64.zip -Force

      - uses: actions/upload-artifact@v5
        with:
          name: local-llm-windows-x64
          path: gui/dist/local-llm.exe

      - name: Release
        if: steps.version.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: gui/dist/local-llm-windows-x64.zip
          generate_release_notes: true
          prerelease: ${{ contains(steps.version.outputs.tag, '-') }}
