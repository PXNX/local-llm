name: GUI

# Builds gui/ (local-llm.exe) on every push/PR that touches it; a semver tag (v1.2.0, v1.3.0-rc.1) also publishes
# a GitHub release (pre-release for a -suffix). Releases come only from here: release.bat bumps gui/Cargo.toml,
# builds locally, tags and pushes. Nothing private is used or embedded: keys live in the user's local .env.
on:
  push:
    branches: [main]
    tags: ["v[0-9]+.[0-9]+.[0-9]+", "v[0-9]+.[0-9]+.[0-9]+-*"]
    paths: ["gui/**", "models.json", ".github/workflows/gui.yml"]
  pull_request:
    paths: ["gui/**", "models.json", ".github/workflows/gui.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: gui
    steps:
      - uses: actions/checkout@v5

      - name: Semver tag matches the crate version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$'
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          [[ ${GITHUB_REF_NAME#v} =~ $semver ]] || { echo "::error::$GITHUB_REF_NAME is no semver tag (vX.Y.Z[-pre])"; exit 1; }
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "::error::tag $GITHUB_REF_NAME but gui/Cargo.toml says $version - use release.bat"; exit 1; }

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: gui

      - name: Lint
        run: cargo clippy --release --locked -- -D warnings

      - name: Test
        run: cargo test --release --locked

      - name: Build
        run: cargo build --release --locked

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/local-llm.exe dist/
          Compress-Archive -Path dist/local-llm.exe -DestinationPath dist/local-llm-windows-x64.zip -Force

      - uses: actions/upload-artifact@v5
        with:
          name: local-llm-windows-x64
          path: gui/dist/local-llm.exe

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: gui/dist/local-llm-windows-x64.zip
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
