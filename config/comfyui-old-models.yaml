# Passed by start-comfyui.bat: ComfyUI's own models folder stays a second search path, so files there keep
# loading until they are moved into the models folder (--models-directory). base_path is relative to this file.
comfyui_models:
    base_path: ../ComfyUI_windows_portable/ComfyUI/models
    checkpoints: checkpoints
    configs: configs
    loras: loras
    vae: vae
    text_encoders: |
        text_encoders
        clip
    diffusion_models: |
        diffusion_models
        unet
    clip_vision: clip_vision
    style_models: style_models
    embeddings: embeddings
    diffusers: diffusers
    vae_approx: vae_approx
    controlnet: controlnet
    gligen: gligen
    upscale_models: upscale_models
    latent_upscale_models: latent_upscale_models
    hypernetworks: hypernetworks
    photomaker: photomaker
    model_patches: model_patches
    audio_encoders: audio_encoders
    background_removal: background_removal
    frame_interpolation: frame_interpolation
    geometry_estimation: geometry_estimation
    optical_flow: optical_flow
    detection: detection
