; Model presets for the llama.cpp router (`llama serve --models-preset`). The GUI starts the router with
; this file; a [section] name is the model id Pi, OpenCode and T3 Code ask for. Keys are llama.cpp
; command-line options without the leading dashes. The GUI's --ctx-size (LLAMA_CPP_CTX) wins over ctx-size here.
;
; Measured on this laptop (RTX 3060 6 GB as Vulkan1, AMD iGPU as Vulkan0, 32 GB RAM) with a real Pi/T3 Code
; request of 19k tokens:
;   Qwen3.6-35B-A3B (MoE, 3B active)  64k: 16 tokens/s   96k: 11 tokens/s   128k: 4 tokens/s
;   Qwen3-8B heretic (dense)          16k: 4.4 tokens/s (8k fully on the GPU: 27 tokens/s)
; The iGPU is slower than leaving layers on the CPU, so every model runs on the RTX only (device = Vulkan1).
;
; The RTX is only listed as Vulkan1 by a current llama.cpp: `llama update` (the GUI's "Devices" button or
; `llama serve --list-devices` shows the list). The build installed before b12110 listed Vulkan0 = the AMD
; iGPU alone, so `device = Vulkan1` silently fell back to the iGPU and every model ran 3-6x slower
; (TwIL-8B: 9 instead of 85 tokens/s of prompt, 1.6 instead of 7.8 tokens/s).
;
; Dense 8-9B models do not fit the 6 GB VRAM with a usable context: ~5 GB of weights leave ~1 GB, and the
; f16 KV cache for 64k alone is 10.7 GB (it does not even allocate on this machine). They therefore run on
; the CPU with a q8_0 KV cache (`n-gpu-layers = 0`): 4.5 tokens/s, and half-offloading them is slower
; (3.6) because attention then reads the KV cache over PCIe.
;
; A quantized (q8_0) KV cache measured ~10x slower in the earlier runs, which were silently on the iGPU
; (see above), so the models that stay on the GPU keep f16 here. The CPU-only dense models below need
; q8_0: 64k in f16 would be 10.7 GB of RAM and failed to allocate.

version = 1

; Every model: one slot (a second chat queues instead of sharing the KV cache), Qwen3's recommended sampling
; for thinking mode - llama.cpp's default temperature 0.8 garbles tool calls of small models.
[*]
device = Vulkan1
parallel = 1
temp = 0.6
top-p = 0.95
top-k = 20
min-p = 0
jinja = true
; Lossless speed-up: the server guesses the next tokens from text that is already in the conversation and
; the model only checks them in one batch. Pays off whenever a reply repeats existing text - printing a file
; back with a small edit, quoting code, tool-call arguments - and costs nothing on fresh text. Measured here
; on "print this file again with one change" (420 tokens, ~88% of the guesses accepted):
;   Nemotron E4B on the RTX   12.5 -> 32-59 tokens/s      TwIL-8B on the CPU   2.6 -> 6.1 tokens/s
;   Qwen3.8-35B-A3B (MoE)      6.4 -> 6.8 tokens/s (limited by RAM paging, not by the model)
; Fresh text stayed the same (12.7 / 12.4, 3.0 / 2.8). --threads 8 and --prio 2 changed nothing (3.0 / 3.1).
; ngram-simple was the fastest single edit (83 t/s) but ngram-mod is the default: it keeps the n-gram table
; between requests, so the *repeat* of the same edit is 84 t/s instead of 37, and it is what the router
; actually runs when the flows ask for it. ngram-cache is slower than the others (18 t/s) and is not used.
spec-type = ngram-mod

; Default coding model: MoE, so llama.cpp fits attention and the KV cache on the GPU and keeps some experts in
; RAM. Its hybrid attention keeps the KV cache small (64k = 1.3 GB). Vision projector stays in RAM.
; The repo tags the Q4_K_S file "3.80bpw", so the Hugging Face tag is 80BPW; the id says what it is.
[byteshape/Qwen3.6-35B-A3B-GGUF:Q4_K_S]
hf-repo = byteshape/Qwen3.6-35B-A3B-GGUF:80BPW
ctx-size = 65536
no-mmproj-offload = true

; Qwen3.8 distilled into the same 35B-A3B MoE architecture (empero-ai, Apache-2.0): newer and stronger, same
; speed class. Q3_K_M (17.7 GB): IQ4_XS (19.6 GB) did not fit 32 GB RAM next to Windows and paged (0.8 tokens/s).
[empero-ai/Qwen3.8-35B-A3B-Distill-GGUF:Q3_K_M]
hf-repo = empero-ai/Qwen3.8-35B-A3B-Distill-GGUF:Q3_K_M
ctx-size = 65536
no-mmproj-offload = true

; Abliterated Qwen3-8B: dense, its 4.5 GB of weights plus the KV cache don't fit 6 GB, so it is slower than the MoE.
; Native context 40960.
[saidutta69/Qwen3-8B-heretic:Q4_K_M]
hf-repo = saidutta69/Qwen3-8B-heretic:Q4_K_M
ctx-size = 32768

[nvidia/NVIDIA-Nemotron-3.5-Bolt-E4B-4GB:Q4_K_M]
hf-repo = nvidia/NVIDIA-Nemotron-3.5-Bolt-E4B-4GB:Q4_K_M
ctx-size = 57344

; TwIL-8B (Granite 4.2 8B, post-trained for contest math, code and instruction following): 8.8B dense,
; 4.98 GB in Q4_K_M, 131k native context, emits <think> ... </think>. The repo ships two Q4_K_M files
; ("balanced" with shorter thinking, "verbose"), so the file is named instead of the quant.
; Measured here: CPU 14 tokens/s prompt / 4.5 tokens/s (64k, q8_0 KV); 8k on the RTX 85 / 7.8 (weights
; alone use 5.0 of the 6 GB); all layers on the RTX with the KV cache in RAM 12 / 3.6.
[webAI-Official/TwIL-8B:Q4_K_M]
hf-repo = webAI-Official/TwIL-8B
hf-file = TwIL-8B-Q4_K_M-balanced.gguf
ctx-size = 65536
n-gpu-layers = 0
cache-type-k = q8_0
cache-type-v = q8_0

; DeepSeek-V4-Pro distilled into Qwen3.5-9B (heretic/uncensored, mradermacher's i1 imatrix): 5.24 GB dense.
; Same fit problem as TwIL-8B - the weights alone leave ~1 GB of the card - so it runs on the CPU as well;
; 32k of context keeps its q8_0 KV cache at 2.7 GB of RAM.
[mradermacher/DeepSeek-V4-Pro-Qwen3.5-9B-UNCENSORED-heretic-i1-GGUF:Q4_K_M]
hf-repo = mradermacher/DeepSeek-V4-Pro-Qwen3.5-9B-UNCENSORED-heretic-i1-GGUF
hf-file = DeepSeek-V4-Pro-Qwen3.5-9B-UNCENSORED-heretic.i1-Q4_K_M.gguf
ctx-size = 32768
n-gpu-layers = 0
cache-type-k = q8_0
cache-type-v = q8_0
