; Model presets for the llama.cpp router (`llama serve --models-preset`). The GUI starts the router with
; this file; a [section] name is the model id Pi, OpenCode and T3 Code ask for. Keys are llama.cpp
; command-line options without the leading dashes. The GUI's --ctx-size (LLAMA_CPP_CTX) wins over ctx-size here.
;
; Measured on this laptop (RTX 3060 6 GB as Vulkan1, AMD iGPU as Vulkan0, 32 GB RAM) with a real Pi/T3 Code
; request of 19k tokens:
;   Qwen3.6-35B-A3B (MoE, 3B active)  64k: 16 tokens/s   96k: 11 tokens/s   128k: 4 tokens/s
;   Qwen3-8B heretic (dense)          16k: 4.4 tokens/s (8k fully on the GPU: 27 tokens/s)
; The iGPU is slower than leaving layers on the CPU, so every model runs on the RTX only (device = Vulkan1).
; Quantized KV cache (q8_0) made generation 10x slower on Vulkan here, so it stays f16.

version = 1

; Every model: one slot (a second chat queues instead of sharing the KV cache), Qwen3's recommended sampling
; for thinking mode - llama.cpp's default temperature 0.8 garbles tool calls of small models.
[*]
device = Vulkan1
parallel = 1
temp = 0.6
top-p = 0.95
top-k = 20
min-p = 0
jinja = true

; Default coding model: MoE, so llama.cpp fits attention and the KV cache on the GPU and keeps some experts in
; RAM. Its hybrid attention keeps the KV cache small (64k = 1.3 GB). Vision projector stays in RAM.
; The repo tags the Q4_K_S file "3.80bpw", so the Hugging Face tag is 80BPW; the id says what it is.
[byteshape/Qwen3.6-35B-A3B-GGUF:Q4_K_S]
hf-repo = byteshape/Qwen3.6-35B-A3B-GGUF:80BPW
ctx-size = 65536
no-mmproj-offload = true

; Qwen3.8 distilled into the same 35B-A3B MoE architecture (empero-ai, Apache-2.0): newer and stronger, same
; speed class. Q3_K_M (17.7 GB): IQ4_XS (19.6 GB) did not fit 32 GB RAM next to Windows and paged (0.8 tokens/s).
[empero-ai/Qwen3.8-35B-A3B-Distill-GGUF:Q3_K_M]
hf-repo = empero-ai/Qwen3.8-35B-A3B-Distill-GGUF:Q3_K_M
ctx-size = 65536
no-mmproj-offload = true

; Abliterated Qwen3-8B: dense, its 4.5 GB of weights plus the KV cache don't fit 6 GB, so it is slower than the MoE.
; Native context 40960.
[saidutta69/Qwen3-8B-heretic:Q4_K_M]
hf-repo = saidutta69/Qwen3-8B-heretic:Q4_K_M
ctx-size = 32768

[nvidia/NVIDIA-Nemotron-3.5-Bolt-E4B-4GB:Q4_K_M]
hf-repo = nvidia/NVIDIA-Nemotron-3.5-Bolt-E4B-4GB:Q4_K_M
ctx-size = 57344
